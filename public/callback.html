<!DOCTYPE html>
<html>

<head>
    <title>Processing Login...</title>
    <style>
        :root {
            --bg-0: #050505;
            --bg-1: #0d0d0d;
            --green-1: #84f01a;
            --green-2: #a6ff4d;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 100%);
            color: var(--green-2);
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.015);
            border: 1px solid #232323;
            padding: 40px;
            border-radius: 14px;
            max-width: 400px;
        }

        .spinner {
            font-size: 48px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        h2 {
            margin-top: 20px;
            font-weight: 600;
        }

        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.5);
            color: #fca5a5;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
        }

        .error button {
            padding: 10px 20px;
            background: rgba(239, 68, 68, 0.3);
            border: 1px solid #fca5a5;
            color: #fca5a5;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: 600;
        }

        .error button:hover {
            background: rgba(239, 68, 68, 0.5);
        }
    </style>
</head>

<body>
    <div id="content" class="container">
        <div class="spinner">⏳</div>
        <h2>Processing login...</h2>
    </div>

    <script>
        const OIDC_SERVER_URL = "https://oidc-server-be.vercel.app/";
        const CLIENT_ID = "671c904ed6a1bfd17ec18118";
        const REDIRECT_URI = "http://localhost:5000/callback";

        async function handleCallback() {
            try {
                const params = new URLSearchParams(window.location.search);
                const code = params.get("code");
                const returnedState = params.get("state");
                const error = params.get("error");

                if (error) {
                    showError("Login failed: " + error);
                    return;
                }

                if (!code) {
                    showError("No authorization code received");
                    return;
                }

                const storedState = localStorage.getItem("state");
                if (returnedState !== storedState) {
                    showError("State mismatch - possible CSRF attack");
                    return;
                }

                const codeVerifier = localStorage.getItem("codeVerifier");

                console.log("📤 Exchanging code for tokens...");

                const tokenResponse = await fetch(`${OIDC_SERVER_URL}token`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        grant_type: "authorization_code",
                        code: code,
                        redirect_uri: REDIRECT_URI,
                        client_id: CLIENT_ID,
                        code_verifier: codeVerifier,
                        client_secret:"71c4b98cecb6b817989c9ecd2c6a5f4ef2a41b9acabab927f394d92d6d846af2"
                    })
                });

                if (!tokenResponse.ok) {
                    const errorData = await tokenResponse.json();
                    throw new Error(errorData.message || "Token exchange failed");
                }

                const tokenData = await tokenResponse.json();
                console.log("✅ Tokens received");

                localStorage.setItem("access_token", tokenData.access_token);
                localStorage.setItem("id_token", tokenData.id_token);
                localStorage.setItem("refresh_token", tokenData.refresh_token);

                console.log("👤 Fetching user info...");

                const userResponse = await fetch(`${OIDC_SERVER_URL}userinfo`, {
                    headers: { "Authorization": `Bearer ${tokenData.access_token}` }
                });

                if (!userResponse.ok) {
                    throw new Error("Failed to fetch user info");
                }

                const userData = await userResponse.json();
                localStorage.setItem("user", JSON.stringify(userData));

                console.log("✅ Login successful!");

                localStorage.removeItem("state");
                localStorage.removeItem("codeVerifier");
                localStorage.removeItem("nonce");

                setTimeout(() => {
                    window.location.href = "/";
                }, 1500);

            } catch (error) {
                console.error("Error:", error);
                showError(error.message);
            }
        }

        function showError(message) {
            document.getElementById("content").innerHTML = `
                <div class="error">
                    <h2>❌ Login Failed</h2>
                    <p>${message}</p>
                    <button onclick="window.location.href='/'">Back to Home</button>
                </div>
            `;
        }

        handleCallback();
    </script>
</body>

</html>
